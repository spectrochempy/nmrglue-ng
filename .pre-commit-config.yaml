default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^examples/|
            ^doc/|
            ^tests/fixtures/fileio/data/|
            ^tests/fixtures/fileio/bruker_test_data/|
            ^tests/fixtures/process/pipe_proc_tests/|
            \.(fid|ft2|ft3|ft4|ser|acqus|procs|jdf|ucsf|par|sec|1r|2r|in|com|tab|png|zip|txt|dat|jdx)$
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^examples/|
            ^doc/|
            ^tests/fixtures/fileio/data/|
            ^tests/fixtures/fileio/bruker_test_data/|
            ^tests/fixtures/process/pipe_proc_tests/|
            \.(fid|ft2|ft3|ft4|ser|acqus|procs|jdf|ucsf|par|sec|1r|2r|in|com|tab|png|zip|txt|dat|jdx)$
          )
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: |
          (?x)(
            ^examples/|
            ^doc/|
            ^tests/fixtures/fileio/data/|
            ^tests/fixtures/fileio/bruker_test_data/|
            ^tests/fixtures/process/pipe_proc_tests/|
            \.(fid|ft2|ft3|ft4|ser|acqus|procs|jdf|ucsf|par|sec|1r|2r|in|com|tab|png|zip|txt|dat|jdx)$
          )
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
        files: \.py$
        exclude: |
          (?x)(
            ^examples/|
            ^doc/
          )
      - id: check-added-large-files
        args: ['--enforce-all']
        exclude: |
          (?x)(
            ^doc/source/_data/historical_examples/|
            ^tests/fixtures/fileio/data/|
            ^tests/fixtures/process/pipe_proc_tests/
          )
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--config, .codespellrc]
        exclude: |
          (?x)(
            ^examples/|
            ^doc/|
            ^tests/fixtures/fileio/data/|
            ^tests/fixtures/fileio/bruker_test_data/|
            ^tests/fixtures/process/pipe_proc_tests/|
            \.(fid|ft2|ft3|ft4|ser|acqus|procs|jdf|ucsf|par|sec|1r|2r|in|com|tab|png|zip|txt|dat|jdx)$
          )
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff F401/F821 (package)
        args: [--select, "F401,F821"]
        files: ^nmrglue/
        exclude: ^(nmrglue/fileio/glue\.py|nmrglue/util/xcpy\.py)$
