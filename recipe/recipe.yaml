context:
  version: "1.1.0"

package:
  name: nmrglue-ng
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nmrglue-ng/nmrglue_ng-${{ version }}.tar.gz
  sha256: 81fb95727a4eec38e525a68326d2a6b0be9c1722db9435c275cf716aaacb9298

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python >=3.10
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - numpy >=1.21.2
    - python >=3.10
    - scipy >=1.7.2
  run_constraints:
    # Both distributions install the nmrglue Python package.
    - nmrglue <0a0

tests:
  - python:
      imports:
        - nmrglue
      pip_check: true

about:
  homepage: https://nmrglue-ng.readthedocs.io/stable/
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: An independent continuation of nmrglue for working with NMR data in Python
  documentation: https://nmrglue-ng.readthedocs.io/stable/
  repository: https://github.com/spectrochempy/nmrglue-ng

extra:
  recipe-maintainers:
    - fernandezc
