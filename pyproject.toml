[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrglue-ng"
dynamic = ["version"]
description = "An independent continuation of nmrglue for working with NMR data in Python"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Jonathan J. Helmus", email = "jjhelmus@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.21.2",
    "scipy>=1.7.2",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "sphinx-design",
    "sphinx_rtd_theme",
    "myst-nb",
    "numpydoc",
    "matplotlib",
]
test = [
    "pytest",
    "h5py",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://nmrglue-ng.readthedocs.io/stable/"
Documentation = "https://nmrglue-ng.readthedocs.io/stable/"
Repository = "https://github.com/spectrochempy/nmrglue-ng"
Issues = "https://github.com/spectrochempy/nmrglue-ng/issues"

[tool.setuptools]
include-package-data = true
packages = [
    "nmrglue",
    "nmrglue.analysis",
    "nmrglue.fileio",
    "nmrglue.interop",
    "nmrglue.process",
    "nmrglue.process.nmrtxt",
    "nmrglue.util",
]

[tool.setuptools_scm]

[tool.mypy]
# Scoped static-typing gate. The `files` list below is the SINGLE source of truth
# for the scope: it grows only by deliberate addition, never by "all new files".
# The pre-commit hook deliberately carries no `files:` filter, so a renamed or
# removed target fails here ("Cannot read file") instead of silently disabling
# the gate. `follow_imports = "silent"` lets mypy resolve imported types while
# reporting diagnostics only for the listed targets, so the legacy tree is not
# checked. Do not add `nmrglue/py.typed`: it is a downstream-facing statement,
# not an internal gate detail.
python_version = "3.10"
follow_imports = "silent"
ignore_missing_imports = true
files = ["nmrglue/interop"]
