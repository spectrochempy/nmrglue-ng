[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrglue-ng"
dynamic = ["version"]
description = "An independent continuation of nmrglue for working with NMR data in Python"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Jonathan J. Helmus", email = "jjhelmus@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.21.2",
    "scipy>=1.7.2",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
]
test = [
    "pytest",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/spectrochempy/nmrglue-ng"
Repository = "https://github.com/spectrochempy/nmrglue-ng"
Issues = "https://github.com/spectrochempy/nmrglue-ng/issues"

[tool.setuptools]
include-package-data = true
packages = [
    "nmrglue",
    "nmrglue.analysis",
    "nmrglue.fileio",
    "nmrglue.process",
    "nmrglue.process.nmrtxt",
    "nmrglue.util",
]

[tool.setuptools.dynamic]
version = {attr = "nmrglue.__version__"}
