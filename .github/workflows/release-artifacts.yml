name: release artifacts

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected nmrglue-ng version, for example 1.0.0rc1"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install build tools
      run: python -m pip install build twine setuptools_scm
    - name: Check source release metadata
      run: >-
        python .github/scripts/check_release_artifacts.py
        --expected-version "${{ inputs.expected_version }}"
    - name: Build sdist and wheel from sdist
      run: python -m build --outdir "${{ runner.temp }}/dist"
    - name: Check artifact metadata and contents
      run: >-
        python .github/scripts/check_release_artifacts.py
        --expected-version "${{ inputs.expected_version }}"
        --dist "${{ runner.temp }}/dist"
    - name: Check distribution rendering
      run: python -m twine check --strict "${{ runner.temp }}"/dist/*
