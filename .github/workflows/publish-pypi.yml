name: publish PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0"
        required: true
        type: string
      expected_version:
        description: "Expected nmrglue-ng version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check requested tag
      run: |
        test "${{ inputs.tag }}" = "v${{ inputs.expected_version }}"

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check out release source
      env:
        TAG: ${{ inputs.tag }}
      run: git worktree add --detach "$RUNNER_TEMP/release-source" "$TAG"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Upgrade pip with the verified security release
      run: >-
        python -m pip install
        "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

    - name: Install build tools
      run: python -m pip install "certifi>=2026.10.19" build twine setuptools_scm

    - name: Check source release metadata
      run: >-
        python .github/scripts/check_release_artifacts.py
        --source-root "$RUNNER_TEMP/release-source"
        --expected-version "${{ inputs.expected_version }}"

    - name: Build sdist and wheel from sdist
      run: python -m build "$RUNNER_TEMP/release-source" --outdir dist

    - name: Check artifact metadata and contents
      run: >-
        python .github/scripts/check_release_artifacts.py
        --source-root "$RUNNER_TEMP/release-source"
        --expected-version "${{ inputs.expected_version }}"
        --dist dist

    - name: Check distribution rendering
      run: python -m twine check --strict dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check out release source
      env:
        TAG: ${{ inputs.tag }}
      run: git worktree add --detach "$RUNNER_TEMP/release-source" "$TAG"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Download PyPI artifacts
      run: >-
        python .github/scripts/download_pypi_release_artifacts.py
        --version "${{ inputs.expected_version }}"
        --output dist

    - name: Extract GitHub Release notes
      run: >-
        python .github/scripts/extract_release_notes.py
        --changelog "$RUNNER_TEMP/release-source/CHANGELOG.md"
        --version "${{ inputs.expected_version }}"
        --output release-notes.md

    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        VERSION: ${{ inputs.expected_version }}
      run: |
        set -euo pipefail
        if gh release view "$TAG"; then
          for artifact in dist/*; do
            basename "$artifact"
          done > expected-assets.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          python .github/scripts/release_assets.py \
            --existing existing-assets.txt --expected expected-assets.txt > surplus-assets.txt
          while IFS= read -r asset; do
            test -z "$asset" || gh release delete-asset "$TAG" "$asset" --yes
          done < surplus-assets.txt
          gh release edit "$TAG" --title "nmrglue-ng $VERSION" --notes-file release-notes.md
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --verify-tag \
            --title "nmrglue-ng $VERSION" --notes-file release-notes.md
        fi
