name: publish PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0"
        required: true
        type: string
      expected_version:
        description: "Expected nmrglue-ng version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check requested tag
      run: |
        test "${{ inputs.tag }}" = "v${{ inputs.expected_version }}"

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install build tools
      run: python -m pip install build twine setuptools_scm

    - name: Check source release metadata
      run: >-
        python .github/scripts/check_release_artifacts.py
        --expected-version "${{ inputs.expected_version }}"

    - name: Build sdist and wheel from sdist
      run: python -m build --outdir dist

    - name: Check artifact metadata and contents
      run: >-
        python .github/scripts/check_release_artifacts.py
        --expected-version "${{ inputs.expected_version }}"
        --dist dist

    - name: Check distribution rendering
      run: python -m twine check --strict dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
