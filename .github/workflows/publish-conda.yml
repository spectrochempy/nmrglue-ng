name: publish Conda package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.1.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to spectrocat
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          test "$TAG" = "v$VERSION"
          test -n "$VERSION"
          git show-ref --verify --quiet "refs/tags/$TAG"
          echo "NMRGLUE_NG_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upgrade pip with the verified security release
        run: >-
          python -m pip install
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Configure Rattler Build to use system certificates
        run: |
          mkdir -p "$RUNNER_TEMP/rattler"
          printf 'tls-root-certs = "native"\n' > "$RUNNER_TEMP/rattler/config.toml"
          echo "RATTLER_HOME=$RUNNER_TEMP/rattler" >> "$GITHUB_ENV"

      - name: Build Conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        env:
          CONDA_BLD_PATH: ../output
        with:
          rattler-build-version: v0.77.0
          recipe-path: recipe/recipe.yaml
          upload-artifact: false
          build-args: -c conda-forge -c spectrocat

      - name: Check artifact identity
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          packages=(../output/**/*.conda ../output/**/*.tar.bz2)
          matches=()
          for package in "${packages[@]}"; do
            if [[ "$(basename "$package")" == "nmrglue-ng-${NMRGLUE_NG_VERSION}-"* ]]; then
              matches+=("$package")
            fi
          done
          test "${#matches[@]}" -eq 1
          echo "path=${matches[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to Anaconda.org
        env:
          NMRGLUE_NG_ANACONDA_API_TOKEN: ${{ secrets.NMRGLUE_NG_ANACONDA_API_TOKEN }}
          PACKAGE: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          test -n "${NMRGLUE_NG_ANACONDA_API_TOKEN:-}"
          python -m pip install --disable-pip-version-check "certifi>=2026.10.19" anaconda-client==1.16.0
          if anaconda --token "$NMRGLUE_NG_ANACONDA_API_TOKEN" show "spectrocat/nmrglue-ng/$NMRGLUE_NG_VERSION"; then
            echo "nmrglue-ng $VERSION is already published on spectrocat" >&2
            exit 1
          fi
          anaconda --token "$NMRGLUE_NG_ANACONDA_API_TOKEN" upload \
            --user spectrocat --label main "$PACKAGE"
